aid: boston-dynamics
name: Boston Dynamics
description: >-
  Boston Dynamics, a Hyundai Motor Group subsidiary, designs advanced mobile
  robots including Spot (agile quadruped for dynamic sensing and industrial
  inspection), Atlas (electric humanoid for manufacturing), Stretch (warehouse
  case-handling robot), and the Orbit enterprise fleet management platform.
  Boston Dynamics publishes a public, open-source Spot SDK (Python and C++)
  on GitHub built on gRPC and Protocol Buffers for developing applications
  and payloads for Spot; Atlas and Stretch are enterprise products without
  public APIs.
