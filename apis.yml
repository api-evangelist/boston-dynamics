apis:
  - aid: boston-dynamics:spot-sdk
    name: Boston Dynamics Spot SDK
    description: >-
      The Spot SDK is an open-source SDK for developing applications and
      payloads for the Spot quadruped robot. Built on gRPC and Protocol
      Buffers, it provides Python and C++ libraries to control Spot, read
      sensor and health data, run autonomous missions, and integrate payloads.
      The SDK ships with example programs, quickstart guides, and concept
      documentation on dev.bostondynamics.com.
